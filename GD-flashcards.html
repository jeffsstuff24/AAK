<!DOCTYPE html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<title>AAK - Flashcards</title>
		<style>
		
			h1 {text-align: center;}
			
			input[type="text"] 
			{
				padding: 2px;
				width: 100px;
				font-size: 12px;
			}
			
			/* Rounded border */
			hr.rounded 
			{
				width: 75%;
				border: 2px solid blue;
				border-radius: 2px;
			}
			
			#grad1 
			{
				height: 200px;
				background-color: RGB(235,235,255); /* For browsers that do not support gradients */
				<!-- background-image: linear-gradient(white, blue); -->
			}
			

			
			
		</style>
	</head>
	<script src="Global.js"></script>
	<body id="grad1">
		<form>
			<!-- ///////////////////////////////////////////////////// -->
			
			<h1>Flash Cards</h1>
			<div id='Index' align="center"><a href="index.html">Back to Index</a></div>
			<div id='docrev' style="text-align:center; margin:0 auto; color: #abb2b9; padding: 5px;">aak_rev</div> 		
					
			<!-- ///////////////////////////////////////////////////// -->
			<p></p>
			<p></p>
			<hr class="rounded">
			<p></p>
			<p></p>
			<!-- ///////////////////////////////////////////////////// -->					
					
			<!-- ///////////////////////////////////////////////////// -->
			<table style="margin-left:auto;margin-right:auto; border: 1px solid black;  border-collapse: collapse;">
				<tr>
					<td colspan="2" style="text-align: center; border: 1px solid black; background-color: #CFCFCF;"><b>Configuration</b></td>
				</tr>
				<tr>
					<td>
						<table>
							<tr>
								<td style="width: 150px;">
									<input type="checkbox" id="chk_random"         >Randomize       <br>
								</td>
							</tr>
							<tr style="text-align: left;">
								<td style="width: 150px;">
									<input type="checkbox" id="chk_hideattack"     >Hide Attack     <br>
								</td>
							</tr>
							<tr style="text-align: left;">
								<td style="width: 150px;">
									<input type="checkbox" id="chk_hidedescription">Hide Description<br>
								</td>
							</tr>	
						</table>
					</td>
					<td>
						<table>
							<tr>
								<td style="text-align: center; width: 150px">Delay:</td>
							</tr>
							<tr>
								<td style="text-align: center; width: 150px;">
									<input type="number" id="technique_delay" value="3" min="3" step="1" style="width:50px;text-align: center;"><br>
								</td>
							</tr>
							<tr>
								<td style="text-align: center; width: 150px;">
									<button type="button" onclick="GetConfigeration()">Set</button> <br>
								</td>
							</tr>	
						</table>
					</td>
				</tr>
			</table>
			
			<!-- ///////////////////////////////////////////////////// -->
			<p></p>
			<p></p>
			<hr class="rounded">
			<p></p>
			<p></p>
			<!-- ///////////////////////////////////////////////////// -->				
			
			<table style="margin-left:auto;margin-right:auto; border-collapse: collapse;">		
				<tr>
					<td><b>Technique:</b></td>
				</tr>
				<tr>
					<td id="t-tech" style="text-align: center; width: 500px; border-top: 1px solid black; border-right: 1px solid black; border-left: 1px solid black; height: 30px; font-size: 32px;">Loading ...</td>
				</tr>
				<tr>
					<td id="t-rank" style="text-align: center; width: 500px; border-bottom: 1px solid black; border-right: 1px solid black; border-left: 1px solid black; height: 20px; font-size: 16px;">Loading ...</td>
				</tr>
				<tr>
					<td></td>
				</tr>	
				<tr>
					<td><b>Attack:</b></td>
				</tr>
				<tr>
					<td id="t-attack" style="text-align: center; width: 500px; border: 1px solid black; height: 50px;">Loading ...</td>
				</tr>
				<tr>
					<td></td>
				</tr>	
				<tr>
					<td><b>Description:</b></td>
				</tr>
				<tr>
					<td id="t-desc" style="text-align: center; width: 250px; border: 1px solid black; height: 50px;">Loading ...</td>
				</tr>
				<tr>
					<td></td>
				</tr>
				
			</table>
					
			<!-- ///////////////////////////////////////////////////// -->
			<hr class="rounded">
			<p></p>
			<p></p>
			<p></p>
			<p></p>
			<p></p>
			<p></p>		
		</form>
	</body>
	
	<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

	<script>
	
		document.getElementById("docrev").innerHTML = aak_rev;
		/////////////////////////////////////////////////////////////
		// COLLECT TECHNIQUE INFO FROM GOOGLE DRIVE
		/////////////////////////////////////////////////////////////
		
		var dID = [];
		var dRank = [];
		var dTechnique = [];
		var dAttack = [];
		var dDescription = [];
		var dExtension = [];
		var dGroup = [];
		var dCategory = [];
		var dLink1 = [];
		var dLink2 = [];

		var dGroup_sorted = [];
		var dCategory_sorted = [];	
		
		var rand = -1;
		var ans_tech = [];
		var ans_desc = [];		
		
		var IsRandom = false;
		var HideAttack = false;
		var HideDescription = false;
		var tdelay = parseInt(document.querySelector("#technique_delay").value) * 1000;			
		
		let myVar = setInterval(myTimer, tdelay);
		
		navigator.wakeLock.request('screen');

		var url = 'https://script.google.com/macros/s/AKfycbz4VLAzAw-mtE8auvEB-tXvAcPFcO-jnzV48aMRRTQqidYe9Ig6Tdt2cJU8EfRJCrPt/exec';

		$.ajax({
			url: url,
			dataType: "json",
			success: function (data) 
			{   
				//console.log("25 -> " + JSON.stringify(data));
				//console.log("26 -> " + data.data.length);
				
				for (var i=0; i<data.data.length; i++) 
				{
					
					dID.push(data.data[i].ID);
					dRank.push(data.data[i].Rank);
					dTechnique.push(data.data[i].Technique);
					dAttack.push(data.data[i].Attack);
					dDescription.push(data.data[i].Description);
					dGroup.push(data.data[i].Group);
					dCategory.push(data.data[i].Category);
					dLink1.push(data.data[i].Link1);
					dLink2.push(data.data[i].Link2);
					
					dCategory_sorted.push(data.data[i].Category);
					dGroup_sorted.push(data.data[i].Group);

				}
			
				GetConfigeration();	
				
			},
			error: function (err) 
			{
				console.log("ERROR: " + err.status);
			}
		});

		
		function DoFlashcards() 
		{
			ClearData();

			GetRandomQuestion();

			/////////////////////////////////////////////////////////
			if (HideAttack == true)
			{
				document.getElementById("t-attack").innerHTML = "";
			}
			else
			{
				document.getElementById("t-attack").innerHTML = dAttack[rand];
			}
			/////////////////////////////////////////////////////////
			document.getElementById("t-rank").innerHTML = "( " + dRank[rand]+ " ) ";
			document.getElementById("t-tech").innerHTML = dTechnique[rand];
			/////////////////////////////////////////////////////////
			if (HideDescription == true)
			{
				document.getElementById("t-desc").innerHTML = "";
			}
			else
			{
				document.getElementById("t-desc").innerHTML = dDescription[rand];
			}
			/////////////////////////////////////////////////////////
			
		}
		

		
		function GetRandomQuestion()
		{
			if (IsRandom == true)
			{
				//Iterate however many times it takes to get a good technique	
				do
				{
					rand = Math.floor(Math.random() * dID.length);
					//alert("Group = " + dGroup[rand]);					
				}while(dGroup[rand] == "x" || dGroup[rand] == "X");
			}
			else
			{
				rand++;
			}
		}
		
		function ClearData()
		{
			//alert("start ClearData");
			document.getElementById("t-attack").innerHTML = "";
			document.getElementById("t-tech").innerHTML = "";
			document.getElementById("t-desc").innerHTML = "";

			//alert("end ClearData");				
		}	
			
		function GetConfigeration() 
		{  
			
			IsRandom = false;
			HideAttack = false;
			HideDescription = false;
			
			
			var ir = document.getElementById("chk_random");  
			var ha = document.getElementById("chk_hideattack");  
			var hd = document.getElementById("chk_hidedescription");
			tdelay = parseInt(document.querySelector("#technique_delay").value)*1000;
			
			if (ir.checked == true)
			{  
				IsRandom = true;  
			}  
			if (ha.checked == true)
			{  
				HideAttack = true;  
			}  
			if (hd.checked == true)
			{  
				HideDescription = true;  
			}  
			
			clearInterval(myVar);
			myVar = setInterval(myTimer, tdelay);
		}  
		
		function myTimer() 
		{
			console.log("tdelay = " + tdelay);
			DoFlashcards();
		}
		
		// add separation from bootom of page
		var box = document.createElement("div");
		box.style.backgroundColor = "#eceae9";
		box.style.width = "100%"; 
		box.style.height = "100px"; 
		document.body.appendChild(box); 		
		
	</script>
</html>
