<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video Player</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

<style>
    .bs-example
	{
    	margin: 10px;
    }

	.modal-dialog 
	{
	  width: auto;
	  max-width: 960px; // Optional, maximum width
	}	

</style>

<script>
	$(document).ready(function(){
		/* Get iframe src attribute value i.e. YouTube video url
		and store it in a variable */
		var url = $("#cartoonVideo").attr('src');
		
		/* Assign empty url value to the iframe src attribute when
		modal hide, which stop the video playing */
		$("#myModal").on('hide.bs.modal', function(){
			$("#cartoonVideo").attr('src', '');
		});
		
		/* Assign the initially stored url back to the iframe src
		attribute when modal is displayed again */
		$("#myModal").on('show.bs.modal', function(){
			$("#cartoonVideo").attr('src', url);
		});
	});
</script>
</head>
<body>
	<div class="bs-example">
		<!-- Button HTML (to Trigger Modal) -->
		<a href="#myModal" class="btn btn-primary btn-lg" data-toggle="modal">Launch Demo Modal</a>

		<!-- Modal HTML -->
		<div id="myModal" class="modal fade">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-body">
						<div class="modal-header">
							<button type="button" class="close" data-dismiss="modal">&times;</button>
						</div>				
						<div class="embed-responsive embed-responsive-16by9">
							<!--
							<iframe id="cartoonVideo" class="embed-responsive-item"
						src="https://u.pcloud.link/publink/show?code=XZ8BYw5ZtjJNCXFOY9ysDRnA8IQKkXnKwfe7" allowfullscreen>								
						</iframe>
							-->
							<iframe id="cartoonVideo" class="embed-responsive-item"
						src="https://mega.nz/file/mgBX2QJC#vjtpOGItetlEAFaulUFGe_4uxnmQUbL3bt2rHo_Xxv8" allowfullscreen>								
						</iframe>							
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>   
<hr>
<p></p>  
</body>
</html>

<script>
	////////////////////// GET CURRENT TIME //////////////////////////////
	let myDate = new Date();
	let myDay = myDate.getDay();

	// Array of days. 
	let weekday = ['Sunday', 'Monday', 'Tuesday',
	'Wednesday', 'Thursday', 'Friday', 'Saturday'
	];
	document.write("Today is : " + weekday[myDay]);
	document.write("<br/>");

	// get hour value. 
	let hours = myDate.getHours();
	let ampm = hours >= 12 ? 'PM' : 'AM';
	hours = hours % 12;
	hours = hours ? hours : 12;
	let minutes = myDate.getMinutes();
	minutes = minutes < 10 ? '0' + minutes : minutes;
	let myTime = hours + " " + ampm + " : " + minutes +
	" : " + myDate.getMilliseconds();
	document.write("\tCurrent time is : " + myTime); 

</script>
